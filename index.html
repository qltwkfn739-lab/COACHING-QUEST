<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COACHING QUEST</title>
<style>
/* ===== 색상·글꼴 설정 (여기만 바꾸면 전체 분위기가 바뀝니다) ===== */
:root{
  --beige:#F3EDE4; --ivory:#FAF8F4; --sand:#E6D8C8; --char:#34302D; --mut:#7A716A;
  --red:#A50034; --red2:#C8102E; --ok:#4F6B4A; --okbg:#E9EFE4; --no:#A33A2E; --nobg:#F6E3DF;
  --font:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--beige);color:var(--char);font-family:var(--font);line-height:1.6;font-size:16px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--red2);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:24px 18px 60px}
h1,h2,h3{letter-spacing:-.02em;line-height:1.25;margin:0}
h2{font-size:1.7rem;margin:18px 0 10px}
p{margin:0 0 10px}
.mut{color:var(--mut);font-size:.92rem}

/* 상단 바 */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-weight:700;color:var(--red);margin-right:auto}
.pill{background:var(--ivory);border:1px solid var(--sand);border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600}
.ghost{background:transparent;border:1px solid var(--sand);border-radius:999px;padding:8px 16px;font-weight:600}
.ghost:hover{background:var(--ivory)}
.btn{background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 24px;font-weight:700;box-shadow:0 6px 16px rgba(165,0,52,.22);transition:transform .15s,background .15s}
.btn:hover{background:var(--red2);transform:translateY(-1px)}
.btn:disabled{background:#cdbfb0;box-shadow:none;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* 메인 */
.hero{padding:34px 0 18px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1rem;color:var(--red)}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-style:normal}
.hero h1{font-size:clamp(2.4rem,7vw,4.2rem);font-weight:800;margin:14px 0 10px}
.hero p.sl{font-size:1.15rem;font-weight:600}
.status{background:var(--ivory);border:1px solid var(--sand);border-radius:22px;padding:18px 22px;margin:18px 0 26px;box-shadow:0 8px 24px rgba(52,48,45,.07);display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.status .n{font-size:1.9rem;font-weight:800;color:var(--red)}
.status .n small{font-size:.9rem;color:var(--mut);font-weight:600}
.meter{flex:1;min-width:200px}
.track{height:10px;background:var(--sand);border-radius:99px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:var(--red);border-radius:99px;transition:width .8s ease}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--ivory);border:1px solid var(--sand);border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(52,48,45,.07);display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--c)}
.ic{width:46px;height:46px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.3rem;font-weight:800}
.card h3{font-size:1.2rem}
.card p{color:var(--mut);font-size:.95rem;flex:1}
.badge{font-size:.85rem;font-weight:700;color:var(--mut)}
.badge.done{color:var(--ok)}
.card .btn{align-self:flex-start;background:var(--c)}
.final{margin-top:20px;background:var(--char);color:var(--ivory);border-radius:22px;padding:22px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.final p{margin:0;color:#e6d8c8}
.final .btn{background:var(--red2)}
.c1{--c:#A50034}.c2{--c:#8A6A4F}.c3{--c:#6B7A57}.c4{--c:#4A4440}.c5{--c:#B5524A}

/* 게임 공통 */
.fb{background:var(--ivory);border:1px solid var(--sand);border-left:5px solid var(--red);border-radius:14px;padding:12px 16px;margin:10px 0 16px;animation:pop .25s ease}
.fb.ok{border-left-color:var(--ok);background:var(--okbg)}
.fb.no{border-left-color:var(--no);background:var(--nobg)}
@keyframes pop{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:block;width:100%;text-align:center;background:var(--ivory);border:2px solid var(--sand);border-radius:16px;padding:16px 10px;margin-bottom:10px;font-weight:700;transition:border-color .15s,transform .15s}
.tile:hover:not(:disabled){border-color:var(--red);transform:translateY(-1px)}
.tile.num{font-size:1.3rem;color:var(--red)}
.tile.sel{border-color:var(--red);background:#F7E4E9}
.tile.done{background:var(--okbg);border-color:var(--ok);color:var(--ok);cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px}
.chip{background:var(--ivory);border:2px solid var(--sand);border-radius:999px;padding:9px 18px;font-weight:600}
.chip.on{border-color:var(--ok);background:var(--okbg)}
.chip.bad{border-color:var(--no);background:var(--nobg)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 16px}
.slot{min-height:64px;border:2px dashed var(--sand);border-radius:16px;padding:8px;background:var(--ivory);font-weight:700;text-align:center;display:flex;flex-direction:column;justify-content:center}
.slot.full{border-style:solid;border-color:var(--red)}
.slot small{color:var(--mut);font-weight:600}
.note{background:#F7EFD9;border:1px solid #E6D3A0;border-radius:14px;padding:10px 14px;font-size:.92rem;margin-bottom:12px}
.q{background:var(--ivory);border:1px solid var(--sand);border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(52,48,45,.07)}
.q .sit{font-weight:800;color:var(--red);margin-bottom:6px}
.q .say{font-size:1.2rem;font-weight:700;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;background:var(--beige);border:2px solid var(--sand);border-radius:14px;padding:13px 16px;margin-bottom:10px}
.opt:hover:not(:disabled){border-color:var(--red)}
.opt.best{border-color:var(--ok);background:var(--okbg)}
.opt.mine{border-color:var(--red)}
.opt small{display:block;margin-top:4px;color:var(--mut);font-weight:500}
.res{text-align:center;background:var(--ivory);border:1px solid var(--sand);border-radius:22px;padding:24px;box-shadow:0 8px 24px rgba(52,48,45,.07)}
.big{font-size:4rem;font-weight:800;color:var(--red);line-height:1}
.big small{font-size:1.2rem;color:var(--mut)}
.rev{margin-top:16px;display:grid;gap:10px}
.rv{border-radius:14px;padding:12px 16px;border-left:5px solid}
.rv.ok{background:var(--okbg);border-color:var(--ok)}
.rv.no{background:var(--nobg);border-color:var(--no)}
.blocks{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.blk{background:var(--ivory);border:1px solid var(--sand);border-radius:12px;padding:8px 12px;text-align:left;font-size:.93rem}
.blk:hover{border-color:var(--red);background:#F7E4E9}
textarea{width:100%;min-height:150px;border:2px solid var(--sand);border-radius:16px;padding:14px;font-family:inherit;font-size:1rem;background:var(--ivory);color:var(--char);resize:vertical}
.prev{background:var(--char);color:var(--ivory);border-radius:18px;padding:16px 20px;margin-top:12px;white-space:pre-wrap;min-height:60px}
@media(max-width:600px){.two{grid-template-columns:1fr 1fr;gap:8px}h2{font-size:1.4rem}.tile{padding:14px 6px;font-size:.95rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 로그인 화면 */
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:24px 18px}
.logincard{width:100%;max-width:440px;background:var(--ivory);border:1px solid var(--sand);border-radius:24px;padding:30px 26px;box-shadow:0 8px 24px rgba(52,48,45,.07)}
.logincard h1{font-size:2.2rem;font-weight:800;margin:14px 0 8px}
.logincard label{display:block;font-weight:700;margin:14px 0 6px;font-size:.95rem}
.logincard input{width:100%;border:2px solid var(--sand);border-radius:14px;padding:12px 14px;font-family:inherit;font-size:1rem;background:#fff;color:var(--char)}
.logincard input:focus-visible{outline:3px solid var(--red2);outline-offset:2px}
.logincard .btn{width:100%;margin-top:16px}
.userbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:.9rem;color:var(--mut);flex-wrap:wrap}
</style>
<!-- Supabase 라이브러리 + 설정값. Secret/service_role 키는 절대 넣지 마세요. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   ★ 여기에 Supabase 값을 직접 입력하세요 (이 부분만 수정) ★
   Supabase 대시보드 > Project Settings > API 에서 복사
   - SUPABASE_URL : https://wtcwyeaupoeperqrspjf.supabase.co 형태
   - SUPABASE_PUBLISHABLE_KEY : sb_publishable_m-7oK4ltZ3IhgoktJhq6DQ_GtfY8J7k로 시작
   ※ Secret Key / service_role 키는 절대 넣지 마세요.
   ============================================================ */
window.CQ_CONFIG = {
  SUPABASE_URL: 'https://wtcwyeaupoeperqrspjf.supabase.co',
  SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_m-7oK4ltZ3IhgoktJhq6DQ_GtfY8J7k'
};
</script>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== 저장 / 공통 도구 ===================== */
let KEY = 'coachingQuest.v1';
let S = { scores: {}, mission: '' };
/* 로그인한 사용자 ID별로 저장 칸을 나눕니다 (같은 PC를 여러 명이 써도 점수가 섞이지 않음) */
function loadState(uid) {
  KEY = 'coachingQuest.v1.' + uid;
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.scores) S = { scores: {}, mission: '' };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const app = document.getElementById('app');
const $ = s => document.querySelector(s);
let timer = null;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const bindAll = (sel, fn) => app.querySelectorAll(sel).forEach(el => { el.onclick = () => fn(el); });

/* ===================== 게임 목록 (메인 카드) ===================== */
const GAMES = [
  { id: 'g1', cls: 'c1', icon: '#', name: '숫자수집가', desc: '핵심 수치 카드와 의미 카드를 시간 안에 연결하세요.', run: () => g1() },
  { id: 'g2', cls: 'c2', icon: '✦', name: '필수키워드 수집작전', desc: '섞여 있는 단어 중 AI RP 평가의 핵심 키워드만 찾아내세요.', run: () => g2() },
  { id: 'g3', cls: 'c3', icon: '⇅', name: '설명순서퍼즐', desc: '제품이 물과 공기를 다루는 원리를 카드로 이어 보세요.', run: () => g3() },
  { id: 'g4', cls: 'c4', icon: '❝', name: '고객의 선택은?', desc: '고객의 상황을 읽고 알맞은 응대를 고르면 반응이 달라집니다.', run: () => g4() },
  { id: 'g5', cls: 'c5', icon: '✚', name: '케어서비스 전문가', desc: '기본 케어와 MAX 전문 케어를 정확히 구분해 보세요.', run: () => g5() }
];
const gm = id => GAMES.find(g => g.id === id);

/* ===================== 메인 화면 ===================== */
function home() {
  if (!AUTH.ok) { showLogin(); return; }
  clearInterval(timer);
  const done = GAMES.filter(g => S.scores[g.id] !== undefined).length;
  const total = GAMES.reduce((a, g) => a + (S.scores[g.id] || 0), 0);
  app.innerHTML = `<div class="wrap">
    <div class="hero">
      <div class="userbar"><span id="ue"></span><button class="ghost" id="lo">로그아웃</button></div>
      <div class="logo"><i>CQ</i><span>LG전자 판매 매니저 코칭 플랫폼</span></div>
      <h1>COACHING QUEST</h1>
      <p class="sl">AI가 평가하고, 게임으로 발견하고, 코칭으로 성장한다.</p>
      <p class="mut">AI RP에서 놓친 부분을 게임으로 채우고, 마지막에는 나만의 판매 화법을 완성해 보세요.</p>
    </div>
    <div class="status">
      <div><div class="mut">전체 점수</div><div class="n">${total}<small> / 500점</small></div></div>
      <div class="meter"><div class="mut">진행 현황 ${done} / 5 게임 완료</div><div class="track"><div class="fill" style="width:${done * 20}%"></div></div></div>
    </div>
    <div class="grid">${GAMES.map((g, i) => {
      const sc = S.scores[g.id];
      return `<div class="card ${g.cls}"><div class="ic">${g.icon}</div><h3>GAME ${i + 1}. ${g.name}</h3><p>${g.desc}</p>
      <div class="badge ${sc !== undefined ? 'done' : ''}">${sc !== undefined ? '완료 · 최고 ' + sc + '점' : '아직 도전 전'}</div>
      <button class="btn" data-g="${g.id}">${sc !== undefined ? '다시 도전하기' : '게임 시작'}</button></div>`;
    }).join('')}</div>
    <div class="final"><div><h3>최종 미션 · 나만의 판매 화법 완성하기</h3><p>배운 내용을 내 말로 이어 붙여 고객에게 건넬 문장을 만들어 보세요.</p></div><button class="btn" id="fm">최종 미션으로 이동</button></div>
    <p style="margin-top:22px"><button class="ghost" id="rs">진행 기록 지우기</button></p>
  </div>`;
  bindAll('[data-g]', b => gm(b.dataset.g).run());
  $('#fm').onclick = mission;
  $('#ue').textContent = AUTH.email;
  $('#lo').onclick = logout;
  $('#rs').onclick = () => { if (confirm('저장된 점수와 작성한 문장이 모두 지워집니다. 계속할까요?')) { S = { scores: {}, mission: '' }; save(); home(); } };
}

function shell(tag, title, body, extra) {
  if (!AUTH.ok) { showLogin(); throw new Error('로그인이 필요합니다.'); }
  app.innerHTML = `<div class="wrap"><div class="bar"><button class="ghost" id="back">← 메인으로</button><span class="tag">${tag}</span>${extra || ''}</div><h2>${title}</h2>${body}</div>`;
  $('#back').onclick = home;
  window.scrollTo(0, 0);
}

function result(id, score, review, retry, note) {
  clearInterval(timer);
  score = Math.max(0, Math.min(100, Math.round(score)));
  S.scores[id] = Math.max(S.scores[id] || 0, score); save();
  const msg = score >= 80 ? '훌륭해요! 핵심을 정확히 잡고 있어요.' : score >= 50 ? '좋아요! 아래 해설로 놓친 부분만 채워 보세요.' : '괜찮아요. 해설을 읽고 한 번 더 도전해 보세요.';
  shell(gm(id).name, '게임 결과', `<div class="res"><div class="big">${score}<small> / 100</small></div><p style="margin-top:8px"><b>${msg}</b></p><p class="mut">최고 점수 ${S.scores[id]}점</p></div>
    ${note ? `<div class="note" style="margin-top:14px">${note}</div>` : ''}
    <div class="rev">${review.map(r => `<div class="rv ${r.ok ? 'ok' : 'no'}"><b>${r.ok ? '정답' : '다시 확인'}</b><div>${r.t}</div></div>`).join('')}</div>
    <div class="row"><button class="btn" id="re">다시 도전하기</button><button class="ghost" id="hm">메인으로</button></div>`);
  $('#re').onclick = retry; $('#hm').onclick = home;
}

/* ===================== GAME 01. 숫자수집가 (매칭 + 제한시간) ===================== */
const G1 = [
  { n: '850cc/h', m: '시간당 가습량', why: '850cc/h의 "/h"는 시간당을 뜻해요. 한 시간 동안 가습되는 양입니다.' },
  { n: '4.5L', m: '물통 용량', why: '4.5L는 물통에 담을 수 있는 물의 양이에요. 물을 자주 채우지 않아도 된다는 설명으로 이어집니다.' },
  { n: '18시간', m: '중풍 기준 사용 시간', why: '18시간은 풍량을 중풍으로 두었을 때 사용할 수 있는 시간이에요. 반드시 "중풍 기준"이라고 함께 말해 주세요.' }
];
const G1X = ['하루 총 가습량', '필터 교체 주기'];
function g1() {
  clearInterval(timer);
  const st = { sel: null, done: {}, err: 0, t: 45, fb: '숫자 카드를 먼저 고른 뒤, 알맞은 의미 카드를 고르세요.', cls: '', over: false };
  const nums = shuffle(G1.map(x => x.n));
  const ms = shuffle(G1.map(x => x.m).concat(G1X));
  function end() {
    if (st.over) return; st.over = true;
    const ok = Object.keys(st.done).length;
    const sc = ok * 30 + (ok === 3 ? Math.max(0, st.t) / 45 * 10 : 0) - st.err * 5;
    result('g1', sc, G1.map(x => ({ ok: !!st.done[x.n], t: `<b>${x.n}</b> = ${x.m}<br>${x.why}` })), g1);
  }
  function draw() {
    const used = Object.values(st.done);
    shell('GAME 01', '숫자수집가', `<div class="fb ${st.cls}">${st.fb}</div>
      <div class="two"><div>${nums.map(n => `<button class="tile num ${st.done[n] ? 'done' : ''} ${st.sel === n ? 'sel' : ''}" data-n="${n}" ${st.done[n] ? 'disabled' : ''}>${n}</button>`).join('')}</div>
      <div>${ms.map(m => `<button class="tile ${used.indexOf(m) >= 0 ? 'done' : ''}" data-m="${m}" ${used.indexOf(m) >= 0 ? 'disabled' : ''}>${m}</button>`).join('')}</div></div>
      <p class="mut">정답 +30점 · 오답 -5점 · 모두 맞히면 남은 시간 보너스</p>`,
      `<span class="pill" id="tm">⏱ ${st.t}초</span><span class="pill">오답 ${st.err}</span>`);
    bindAll('[data-n]', b => { st.sel = b.dataset.n; st.fb = `<b>${st.sel}</b> 카드를 골랐어요. 이제 의미 카드를 고르세요.`; st.cls = ''; draw(); });
    bindAll('[data-m]', b => {
      if (!st.sel) { st.fb = '먼저 왼쪽에서 숫자 카드를 골라 주세요.'; st.cls = 'no'; draw(); return; }
      const x = G1.find(g => g.n === st.sel);
      if (x.m === b.dataset.m) {
        st.done[x.n] = x.m; st.cls = 'ok'; st.fb = `정답! <b>${x.n}</b> = ${x.m}. ${x.why}`; st.sel = null;
        draw();
        if (Object.keys(st.done).length === G1.length) setTimeout(end, 1500);
      } else {
        st.err++; st.cls = 'no'; st.fb = `<b>${x.n}</b>은(는) "${b.dataset.m}"이(가) 아니에요. 힌트: ${x.why}`; draw();
      }
    });
  }
  draw();
  timer = setInterval(() => { st.t--; const e = $('#tm'); if (e) e.textContent = '⏱ ' + st.t + '초'; if (st.t <= 0) end(); }, 1000);
}

/* ===================== GAME 02. 필수키워드 수집작전 (단어 수집) ===================== */
const K = [
  ['공간 크기', '고객의 방·집 크기에 맞는 제품인지 설명하는 기준이에요. 사용할 공간이 어느 정도인지 꼭 짚어 주세요.'],

  const pool = shuffle(P.map((p, i) => i));

const O = [

];
function g3() {
  let pool = [0, 1, 2, 3];
  do { pool = shuffle(pool); } while (pool.join() === '0,1,2,3');
  const seq = [];

    const left = pool.filter(i => seq.indexOf(i) < 0);
    shell('GAME 03', '설명순서퍼즐', `<div class="note">제품 원리를 이해하기 위한 퍼즐이에요. 실제 AI RP 평가에서는 <b>설명 순서가 점수에 영향을 주지 않아요.</b> 순서를 외우기보다 각 단계의 역할을 이해해 보세요.</div>

      <div class="slots">${[0, 1, 2, 3].map(k => `<button class="slot ${seq[k] !== undefined ? 'full' : ''}" data-s="${k}"><small>${k + 1}번째</small>${seq[k] !== undefined ? O[seq[k]][0] : '비어 있음'}</button>`).join('')}</div>

      const review = O.map((o, i) => {

    bindAll('[data-k]', b => { picked = +b.dataset.k; const hit = picked === s.a; if (hit) ok++; log.push({ ok: hit, t: `<b>${s.q}</b><br>정답: ${s.o[s.a]}<br>${s.w}` }); draw(); });
    const nx = $('#nx');
    if (nx) nx.onclick = () => { if (i === Q.length - 1) result('g5', ok / Q.length * 100, log, g5, '핵심 정리: 기본 케어 = 상태 확인 · 필터 · 세척/재조립 · 작동 확인. MAX 전문 케어 = 36개월차 방문 + 기본 케어 + 팬 분해 + 분해 스팀클리닝 + UV 살균.'); else { i++; picked = null; draw(); } };
  }
  draw();
}

  ['4. 작동 원리', ['정수필터와 100℃ 살균으로 위생을 챙기고, 공기청정 필터와 청정건조까지 이어져요.', '먼저 정수필터가 물을 걸러 줘요.', '그 물을 100℃ 살균해서 위생적으로 써요.', '공기청정 필터가 공기 중의 오염 물질을 걸러 줘요.', '사용 후에는 청정건조로 내부를 말려 줘요.']],
  ['5. 케어 서비스', ['방문 케어로 필터 점검·교체, 가습부·급수부 세척과 재조립까지 해 드려요.', '기본 케어에서는 제품 상태를 확인해 드려요.', '필터 점검과 교체도 해 드려요.', '가습부와 급수부를 세척하고 다시 조립해 드려요.', '마지막에 정상 작동하는지 확인해 드려요.', '36개월차에는 팬 분해, 분해 스팀클리닝, UV 살균까지 전문 케어를 해 드려요.', '36개월차 방문에서는 기본 케어도 함께 진행해 드려요.', '분해 스팀클리닝과 UV 살균은 36개월차 전문 케어에서만 해 드려요.']],
  ['6. 구매 방법', ['관리가 번거로우시다면 구독이 편한 선택일 수 있어요.', '가격이 부담되신다면 할인 받을 수 있는 방법을 안내 드릴게요.']],
  ['7. 마무리', ['궁금하신 점 더 있으시면 편하게 물어보세요.', '오늘 이야기 나눈 내용을 정리해서 한 번 더 말씀드릴게요.', '직접 보시고 천천히 결정하셔도 좋아요.']]

function mission() {
  clearInterval(timer);
  shell('최종 미션', '나만의 판매 화법 완성하기', `<div class="note">문장 블록을 눌러 이어 붙이고, 아래 칸에서 <b>내 말투로 자유롭게 고쳐 쓰세요.</b> "___" 자리는 직접 채워 보세요.</div>
    ${B.map((g, gi) => `<h3 style="margin:12px 0 4px;font-size:1.05rem">${g[0]}</h3><div class="blocks">${g[1].map((t, ti) => `<button class="blk" data-g="${gi}" data-t="${ti}">${t}</button>`).join('')}</div>`).join('')}
    <h3 style="margin:16px 0 6px;font-size:1.05rem">내가 만든 판매 화법</h3>
    <textarea id="ta" placeholder="블록을 누르거나 직접 입력해 보세요."></textarea>
    <div class="prev" id="pv"></div>
    <div class="row"><button class="btn" id="cp">완성 문장 복사하기</button><button class="ghost" id="cl">모두 지우기</button></div>
    <p class="mut" style="margin-top:10px">작성한 내용은 이 브라우저에 자동 저장돼요.</p>`);
  const ta = $('#ta'), pv = $('#pv');
  ta.value = S.mission || '';
  const upd = () => { S.mission = ta.value; save(); pv.textContent = ta.value || '여기에 완성된 문장이 표시돼요.'; };
  upd();
  ta.oninput = upd;
  bindAll('.blk', b => { const t = B[+b.dataset.g][1][+b.dataset.t]; ta.value += (ta.value && !/\s$/.test(ta.value) ? ' ' : '') + t; upd(); });
  $('#cl').onclick = () => { ta.value = ''; upd(); };
  $('#cp').onclick = e => copyText(ta.value, e.target);
}
function copyText(t, btn) {
  const done = () => { btn.textContent = '복사했어요 ✓'; setTimeout(() => { btn.textContent = '완성 문장 복사하기'; }, 1500); };
  function fallback() { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) { alert('문장을 직접 선택해서 복사해 주세요.'); } a.remove(); }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}

/* ===================== Supabase 로그인 / 접근 권한 ===================== */
const AUTH = { ok: false, email: '' };
const CFG = window.CQ_CONFIG || {};
let sb = null;
const MSG = {
  session: '로그인 세션이 만료되었어요. 다시 로그인해 주세요.',
  denied: '접근 권한이 없는 계정입니다. 관리자에게 문의해 주세요.',
  error: '접근 권한을 확인하지 못했어요. 관리자에게 문의해 주세요.'
};

function authScreen(inner) {
  clearInterval(timer);
  app.innerHTML = `<div class="loginwrap"><div class="logincard">
    <div class="logo"><i>CQ</i><span>LG전자 판매 매니저 코칭 플랫폼</span></div>
    <h1>COACHING QUEST</h1>${inner}</div></div>`;
}

function loginMsg(text, kind) {
  const el = $('#lm'); if (!el) return;
  el.hidden = false; el.className = 'fb ' + (kind || ''); el.textContent = text;
}

function showLogin(msg, kind) {
  AUTH.ok = false; AUTH.email = '';
  authScreen(`<p style="font-weight:600;margin-bottom:6px">AI가 평가하고, 게임으로 발견하고, 코칭으로 성장한다.</p>
    <form id="lf" autocomplete="on">
      <label for="em">회사 이메일</label>
      <input id="em" name="email" type="email" autocomplete="username" required placeholder="name@company.com">
      <label for="pw">비밀번호</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <div id="lm" class="fb" hidden></div>
      <button class="btn" id="lb" type="submit">로그인</button>
    </form>
    <p class="mut" style="margin-top:14px">관리자가 등록한 계정만 로그인할 수 있어요. 계정이 필요하면 관리자에게 문의해 주세요.</p>`);
  if (msg) loginMsg(msg, kind);
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#lb'); btn.disabled = true; btn.textContent = '확인 중…';
    try {
      const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
      if (error) { loginMsg('이메일 또는 비밀번호를 확인해 주세요.', 'no'); btn.disabled = false; btn.textContent = '로그인'; return; }
      await enter();
    } catch (err) {
      loginMsg('로그인 중 문제가 생겼어요. 인터넷 연결을 확인하고 다시 시도해 주세요.', 'no');
      btn.disabled = false; btn.textContent = '로그인';
    }
  };
}

/* 서버에서 세션을 검증하고, 관리자가 승인한 계정(allowed_users)인지 확인합니다 */
async function verify() {
  const { data: u, error: ue } = await sb.auth.getUser();           // 서버에 토큰 검증 요청
  if (ue || !u || !u.user) return { ok: false, why: 'session' };
  const { data: row, error: re } = await sb.from('allowed_users').select('user_id').eq('user_id', u.user.id).maybeSingle();
  if (re) return { ok: false, why: 'error' };
  if (!row) return { ok: false, why: 'denied' };
  return { ok: true, user: u.user };
}

async function enter() {
  const v = await verify();
  if (!v.ok) { await sb.auth.signOut(); showLogin(MSG[v.why], 'no'); return; }
  AUTH.ok = true; AUTH.email = v.user.email || '';
  loadState(v.user.id);
  home();
}

async function logout() {
  AUTH.ok = false; clearInterval(timer);
  try { await sb.auth.signOut(); } catch (e) {}
  showLogin('로그아웃되었어요.', 'ok');
}

async function startApp() {
  if (!window.supabase) { authScreen('<div class="fb no">Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>'); return; }
  const bad = !CFG.SUPABASE_URL || !CFG.SUPABASE_PUBLISHABLE_KEY || /YOUR/.test(CFG.SUPABASE_URL + CFG.SUPABASE_PUBLISHABLE_KEY);
  if (bad) { authScreen('<div class="fb no">index.html 맨 위의 설정 위치에 Supabase URL과 Publishable Key를 입력해 주세요.</div>'); return; }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  /* 다른 탭에서 로그아웃하거나 세션이 끝나면 즉시 로그인 화면으로 */
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && AUTH.ok) showLogin('로그인이 해제되었어요. 다시 로그인해 주세요.', 'no'); });
  /* 탭으로 돌아올 때 권한이 회수되었는지 다시 확인 */
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !AUTH.ok || !navigator.onLine) return;
    const v = await verify();
    if (!v.ok) { AUTH.ok = false; try { await sb.auth.signOut(); } catch (e) {} showLogin(MSG[v.why], 'no'); }
  });
  authScreen('<p class="mut">로그인 상태를 확인하고 있어요…</p>');
  const { data } = await sb.auth.getSession();
  if (data && data.session) await enter(); else showLogin();
}
startApp();
</script>
